openapi: "3.0.0"
info:
  title: Vibe Coffee API Gateway
  version: 1.0.0
paths:
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: "{{FUNCTION_ID}}"
        tag: $latest
  /{proxy+}:
    parameters:
      - name: proxy
        in: path
        required: false
        schema:
          type: string
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: "{{FUNCTION_ID}}"
        tag: $latest